# TODO: Pipeline 2: executar as 23 horas o 
#       script para backup, depois adicionar,
#       commitar e push com o git

# ===================================================
# Nome da pipeline
# ===================================================
name: Pipeline 2 - Backup

permissions:
  contents: write

# ===================================================
# O bloco "on" define os gatilhos da pipeline.
#
# ===================================================
on:
  # -------------------------------------------------
  # Executa automaticamente em horários programados.
  schedule:
    # Todos os dias às 23:00 UTC.
    - cron: "0 23 * * *"
  workflow_dispatch: # Permite execução manual da pipeline

jobs:

  checkout:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------
      # Faz o checkout do repositório.
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      # Configurar versão específica do Python
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Criar pasta de backups
        run: mkdir -p backups

      - name: Executar Backup
        run: |
          # Executa o script de backup
          python ./scripts/backup.py

      - name: Commit e Push das mudanças
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commitar."
          else
            git commit -m "Automated backup commit"
            git push
          fi
