# Pipeline 4: rodar a pipeline manualmente,
# executando o script gerar_docs 
# e publicar docs/ como artifact.

name: Pipeline 4 - Gerar Docs

on:
    # Gatilho para execução manual da pipeline
    workflow_dispatch:

jobs:
  gerar_docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Criar pasta docs
        run: mkdir -p docs

      - name: Executar script gerar_docs.py
        run: python ./scripts/gerar_docs.py

      - name: Publicar docs/ como artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/
